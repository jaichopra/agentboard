[project]
name = "agentboard"
version = "0.1.0"
description = "Python SDK for Agentboard — create AI-powered dashboards programmatically"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentboard"]
