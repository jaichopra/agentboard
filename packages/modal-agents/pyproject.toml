[project]
name = "agentboard-modal"
version = "0.1.0"
description = "Agentboard Modal backend — agent execution, LanceDB storage, data pipelines"
requires-python = ">=3.11"
dependencies = [
    "modal>=0.73.0",
    "anthropic>=0.42.0",
    "lancedb>=0.15.0",
    "pyarrow>=18.0.0",
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
